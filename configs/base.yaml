# Base experiment configuration.
# Hardware-dependent fields (model, dtype, quantization, context) live in
# configs/hardware.yaml, which is auto-generated. Anything here is a research
# choice and is under version control.

seed: 0
seeds: [0, 1, 2]          # probe training seeds

data:
  dataset: ScaleAI/mrt
  revision: main
  # Stratified sample sizes. The signal check (stage 1) uses `n_signal_check`
  # trajectories; the main grid uses `n_total`.
  n_signal_check: 150
  n_total: 1400
  n_smoke: 30
  # Cap per (task x family x label) cell so no single cell dominates. The mrt
  # tree is heavily imbalanced -- one strategy (`selective`) holds ~40% of all
  # attack transcripts.
  max_per_cell: 40
  balance_labels: true
  # All agent models are used. Restricting to the two best-represented ones was
  # the original intent (it would keep the attack-family axis from being
  # confounded with agent identity), but after deduplication that leaves only
  # 381 distinct benign trajectories against 738 across all models. Negatives
  # are the binding constraint on every tail metric in this project, so the
  # wider pool wins and agent identity is instead recorded per trajectory and
  # reported as a confound check. See DECISIONS.md D-016.
  agent_models: null
  min_family_count: 18     # lowered for the matched subset (D-032); families below this are dropped

monitor_view:
  # THE key rendering decision -- see DECISIONS.md D-004.
  # The agent's hidden scratchpad (<model_thinking> ... </model_thinking>)
  # contains explicit statements of malicious intent. A deployed monitor does
  # not see it, and including it makes detection trivial (ceiling AUROC), which
  # would destroy the tail-resolution question this project exists to ask.
  strip_agent_thinking: true
  # The agent's system prompt literally states the secondary task. It is never
  # shown to the monitor.
  strip_agent_system_prompt: true
  # Tool results are enormous (single results exceed 30k characters). Elide the
  # middle of long results, monitor-side, and record how often this fires.
  # Tightened from 2000/6000 after measuring the token distribution: at the
  # original limits the median trajectory was 11,197 tokens and 23.7% overflowed
  # the 16k context, failing Gate 1's 20% truncation criterion. At 800/3000 the
  # median is 7,804 and 13.9% overflow. Eliding harder *within* messages is
  # strictly preferable to truncating the sequence, because it keeps every
  # action visible rather than deleting whole spans of the trajectory
  # (DECISIONS.md D-005, D-018).
  max_tool_result_chars: 800
  max_message_chars: 3000

split:
  train_frac: 0.6
  val_frac: 0.15
  test_frac: 0.25

# Analysis-side restriction, applied in stages 3-5 (not stage 2, so the
# activation cache stays complete and the confounded run remains reproducible).
# The mrt sample is severely imbalanced by generating agent -- agent identity
# alone predicts the label at AUROC 0.805 -- and a probe on mean-pooled
# activations reads writing style, scoring 0.99 without detecting any attack.
# Restricting to a single agent model removes the shortcut by construction.
# See DECISIONS.md D-030, D-031. Set to null to reproduce the confounded run.
analysis:
  restrict_agent_models:
    - claude-3-5-sonnet-20241022
  # Benign mrt runs were generated without a thinking scaffold and attack runs
  # mostly with one, so the *presence* of a stripped <model_thinking> block is
  # itself a near-perfect class cue: it alone separates at AUROC 0.783, better
  # than the monitor's own score. Restricting to trajectories with zero thinking
  # blocks matches the two classes on that artefact exactly (AUROC 0.500).
  # See DECISIONS.md D-032.
  require_zero_thinking: true
  # Structural features are carried through so a baseline fit on them alone can
  # quantify whatever structural leakage survives matching.
  structure_features:
    - render_n_messages_rendered
    - render_rendered_chars
    - render_tool_results_elided
    - render_messages_elided
    - n_messages

probe:
  # L2-regularised logistic regression on cached residual-stream activations.
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
  standardize: true
  representations: [score_pos, mean_pool]

head:
  # Fine-tuned classification head on the same activations -- a stronger
  # comparison than the zero-shot baseline alone.
  hidden_dim: 256
  epochs: 60
  lr: 0.001
  weight_decay: 0.01
  batch_size: 64
  dropout: 0.2

eval:
  fpr_targets: [0.01, 0.003, 0.0003]
  bootstrap_resamples: 10000
  ci: 0.95

# Power and thermal safety. This machine hard-reset twice under sustained GPU
# inference (HYPERVISOR_ERROR 0x00020001, identical parameters both times) --
# see CRASH_MITIGATION.md. These settings flatten the workload's load steps.
power:
  enabled: true
  cooldown_s: 1.5          # pause between trajectories
  max_temp_c: 84           # extend the pause while at or above this
  cpu_max_pct: 70          # CPU headroom during a run; restored on exit
  torch_threads: 4
  prefill_chunk_tokens: 1024   # feed the long-context prefill in segments

paths:
  raw: results/data/raw
  index: results/data/index
